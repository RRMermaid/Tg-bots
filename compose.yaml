services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nalegke
      POSTGRES_USER: nalegke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - diary-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nalegke -d nalegke"]
      interval: 10s
      timeout: 5s
      retries: 10
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: nalegke
      PGUSER: nalegke
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  diary-data:
